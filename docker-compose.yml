# docker compose up --build   then open http://localhost:8080
# First run only:             docker compose exec backend python seed.py
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: paypilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paypilot}
      POSTGRES_DB: paypilot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "paypilot"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env  # copy .env.example to .env first
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Bundled Postgres by default. For your own Postgres set DOCKER_DATABASE_URL in .env
      # (DATABASE_URL there is for running the backend outside Docker).
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://paypilot:${POSTGRES_PASSWORD:-paypilot}@db:5432/paypilot}
      FORWARDED_ALLOW_IPS: 172.30.0.0/16  # trust X-Forwarded-For only from containers on this network (nginx)
    # Inside the container "localhost" is the container itself: for a Postgres on this machine
    # use host.docker.internal in DOCKER_DATABASE_URL (works on Linux, Windows and macOS).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BASE: ${VITE_BASE:-/}
    ports:
      - "${FRONTEND_PORT:-8080}:80"  # the VPS sets FRONTEND_PORT=18001 in .env for the host nginx
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16

volumes:
  pgdata: